name: Validação OrbitShop
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testes de regressão
        run: python -m pytest -q
      - name: Reproduzir métricas e gráficos
        run: python -m src.run --input input/Base_Dados_OrbitShop_v3.xlsx --output outputs
      - name: Memo e relatório
        run: python scripts/build_deliverables.py
      - name: Verificar integridade das fontes
        run: |
          echo "f400a18e7cc838a201981c8a3ae2234e1a32a385ba1a3b91348f4f7770ca6f4b  input/Base_Dados_OrbitShop_v3.xlsx" | sha256sum -c -
          echo "ed902d4c507dd767c52143c4a528720f24da0b779833fcf78c1a1ca78af8f1f5  input/Case_OrbitShop_Individual_v2.pptx" | sha256sum -c -
